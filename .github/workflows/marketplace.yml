name: Publish to Prusa Plugin Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Select bundle from release tag
        id: bundle
        shell: bash
        run: |
          name="${GITHUB_REF_NAME%/v*}"

          # Combined bundles are assembled from plugins/ by tools/build-bundles.sh.
          if [ -f "bundles/$name/manifest.json" ]; then
            dir="dist/bundles/$name"
          else
            dir="plugins/$name"
          fi

          if [ "$name" = "$GITHUB_REF_NAME" ] || { [ ! -f "$dir/manifest.json" ] && [ ! -f "bundles/$name/manifest.json" ]; }; then
            echo "::error::Tag '$GITHUB_REF_NAME' must be <bundle-directory>/v<version>"
            exit 1
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The marketplace shows the release notes under each version, and that is
      # the only long text a later release can still change (the catalogue
      # description is fixed after the first release). So every release carries
      # the plugin's description from docs/marketplace/, followed by the notes
      # written on the GitHub release.
      - name: Compose release notes
        id: notes
        shell: bash
        env:
          NAME: ${{ steps.bundle.outputs.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          description="docs/marketplace/$NAME.md"
          {
            if [ -f "$description" ]; then
              cat "$description"
            else
              echo "::warning::No $description, publishing the release notes only" >&2
            fi
            if [ -n "$RELEASE_BODY" ]; then
              printf '\n### Changes in this version\n\n%s\n' "$RELEASE_BODY"
            fi
          } > release-notes.md

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "changelog<<$delimiter"
            cat release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Check all plugin bundles
        env:
          LUA: lua5.4
        run: |
          luac5.4 -p plugins/*/*.lua
          ./tools/check-plugins.sh
          ./tools/run-tests.sh
          ./tools/build-bundles.sh
          ./tools/check-plugins.sh dist/bundles/*/

      - name: Sign and submit selected bundle
        uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: ${{ steps.bundle.outputs.dir }}
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
          changelog: ${{ steps.notes.outputs.changelog }}
