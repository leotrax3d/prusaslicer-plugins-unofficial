# Print Guard: watches the printers' cameras and pauses a print that has
# visibly failed (spaghetti, a detached part, a blob), with no browser open.
#
# The namespace is absent on purpose: the host derives it from the module path
# github.com/leotrax3d/prusaslicer-plugins-unofficial/connect/print-guard.

name: print-guard
kind: sink
version: 0.1.0
license: MIT
title: Print Guard
summary: Watches your printer cameras and pauses a print that has failed, using a built-in check or a self-hosted Obico AI server.
codeowner: leotrax3d
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

require:
  core: ">=0.1.0-beta.1"
  core-device.get: "*"
  core-device.command: "*"
  core-bus.subscribe: "*"
  core-bus.emit: "*"
  core-storage.read: "*"
  core-state.get: "*"
  core-state.put: "*"
  core-state.list: "*"
  core-state.delete: "*"

# What the module does as itself, with no person behind it.
permissions:
  # read the printers' state and the stream of camera snapshots
  - observe
  # read the snapshot JPEGs the cameras store
  - read_storage
  # pause a print it judged failed
  - operate

# Each failure it detects is published, so another module or a notifier can
# act on it.
events:
  failure: failure.detected

# The port the Obico ML API fetches frames from. Only used with the obico
# detector; each frame is served once, under a random path, for a minute.
needs:
  listen:
    - name: frames
      tcp: 18491
      why: lets the Obico ML API fetch the camera frame it is asked to score

egress:
  - option: obico_url
    why: Sends each new camera frame's address to your self-hosted Obico ML API, which runs the failure-detection model.
    sends: The URL of one frame on this server, and the ML API token when one is set.

options:
  - key: detector
    type: string
    default: auto
    summary: "Which detector scores the frames: heuristic (built in, no setup), obico (self-hosted Obico ML API) or auto (obico when obico_url is set, otherwise heuristic)."
  - key: action
    type: string
    default: pause
    summary: "What to do when a print looks failed: pause pauses it, notify only records the incident and publishes the failure event."
  - key: sensitivity
    type: number
    default: 1
    summary: Multiplies the evidence before it meets the thresholds. 2 reacts to half as much, 0.5 needs twice as much.
  - key: warmup_frames
    type: int
    default: 5
    summary: How many snapshots at the start of a print, and after a resume, are never judged.
  - key: obico_url
    type: string
    default: ""
    summary: The address of your Obico ML API server, for example http://192.168.1.20:3333. Empty uses no AI.
  - key: obico_token
    type: secret
    default: ""
    summary: The ML_API_TOKEN your Obico ML API checks, if it has one.
  - key: frame_base_url
    type: string
    default: ""
    summary: How the Obico ML API reaches this server's frames port, for example http://192.168.1.10:18491.

