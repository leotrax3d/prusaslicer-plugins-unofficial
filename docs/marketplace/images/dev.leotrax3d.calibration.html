<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: JB; font-weight: 400; src: url("fonts/JetBrainsMono-Regular.ttf"); }
  @font-face { font-family: JB; font-weight: 700; src: url("fonts/JetBrainsMono-Bold.ttf"); }
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #0d0e0f; }
  body {
    font-family: JB, monospace; color: #e8e6e0; position: relative;
    background-image: radial-gradient(rgba(232,230,224,.16) 1px, transparent 1.3px);
    background-size: 24px 24px; background-position: 12px 12px;
  }
  .frame { position: absolute; inset: 24px; border: 1px solid rgba(255,255,255,.07); border-radius: 12px; }
  .top { position: absolute; left: 56px; right: 56px; top: 48px; display: flex; justify-content: space-between;
         font-size: 13px; letter-spacing: .22em; color: #8b9096; text-transform: uppercase; }
  .logo { color: #e8e6e0; font-weight: 700; letter-spacing: .08em; }
  .logo b { color: #c5f13e; margin-right: 10px; }
  .title { position: absolute; left: 56px; top: 132px; font-weight: 700; line-height: .98; letter-spacing: -.01em; }
  .title div { font-size: 62px; }
  .outline { color: transparent; -webkit-text-stroke: 1.2px rgba(232,230,224,.55); }
  .lead { position: absolute; left: 56px; top: 310px; width: 400px; font-size: 16px; line-height: 1.75; color: #8b9096; }
  .lead strong { color: #e8e6e0; font-weight: 700; }
  .pill { position: absolute; left: 56px; bottom: 56px; display: flex; gap: 12px; }
  .pill span { font-size: 12px; letter-spacing: .18em; padding: 10px 18px; border-radius: 999px;
               border: 1px solid rgba(255,255,255,.13); color: #8b9096; }
  .pill span.on { background: #c5f13e; color: #0d0e0f; border-color: #c5f13e; font-weight: 700; }
  svg.spec { position: absolute; left: 520px; top: 108px; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="top"><span class="logo"><b>&gt;_</b>LEOTRAX3D</span><span>Plugin bundle · 1.0.1</span></div>
  <div class="title"><div>CALIBRATION</div><div class="outline">EXTRAS</div></div>
  <div class="lead">Three calibration prints <strong>PrusaSlicer does not ship.</strong> Measure it once, then trust the number.</div>
  <div class="pill"><span class="on">PRUSASLICER 3.0</span><span>3 PLUGINS</span><span>MIT</span></div>

  <svg class="spec" width="660" height="440" viewBox="0 0 660 440" font-family="JB, monospace">
    <defs>
      <style>
        .ln { fill: none; stroke: #e8e6e0; stroke-opacity: .7; stroke-width: 1.2; }
        .dim { stroke: #8b9096; stroke-width: 1; fill: none; }
        .lbl { fill: #8b9096; font-size: 11px; letter-spacing: .14em; }
        .val { fill: #8b9096; font-size: 11px; }
        .hit { fill: #c5f13e; }
        .hitv { fill: #c5f13e; font-size: 11px; font-weight: 700; }
        .idx { fill: #c5f13e; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
        .name { fill: #e8e6e0; font-size: 14px; font-weight: 700; letter-spacing: .1em; }
      </style>
    </defs>

    <!-- 01 FAN TOWER: five bands, slender pillar, one band holds the answer -->
    <g transform="translate(20,40)">
      <rect class="hit" x="0" y="56" width="70" height="52" fill-opacity=".9"/>
      <g class="ln">
        <rect x="0" y="4" width="70" height="260"/>
        <line x1="0" y1="56" x2="70" y2="56"/><line x1="0" y1="108" x2="70" y2="108"/>
        <line x1="0" y1="160" x2="70" y2="160"/><line x1="0" y1="212" x2="70" y2="212"/>
        <rect x="98" y="4" width="14" height="260"/>
      </g>
      <g class="dim">
        <line x1="128" y1="4" x2="128" y2="264"/>
        <line x1="124" y1="4" x2="132" y2="4"/><line x1="124" y1="56" x2="132" y2="56"/>
        <line x1="124" y1="108" x2="132" y2="108"/><line x1="124" y1="160" x2="132" y2="160"/>
        <line x1="124" y1="212" x2="132" y2="212"/><line x1="124" y1="264" x2="132" y2="264"/>
      </g>
      <text class="val" x="140" y="34">100%</text>
      <text class="hitv" x="140" y="86">75%</text>
      <text class="val" x="140" y="138">50%</text>
      <text class="val" x="140" y="190">25%</text>
      <text class="val" x="140" y="242">0%</text>
      <line class="dim" x1="-8" y1="264" x2="190" y2="264" stroke-opacity=".5"/>
      <text class="idx" x="0" y="312">01</text>
      <text class="name" x="0" y="336">FAN TOWER</text>
      <text class="lbl" x="0" y="356">PART COOLING</text>
    </g>

    <!-- 02 SPEED TOWER: wider tower, same rhythm, different quantity -->
    <g transform="translate(238,40)">
      <rect class="hit" x="0" y="108" width="110" height="52" fill-opacity=".9"/>
      <g class="ln">
        <rect x="0" y="4" width="110" height="260"/>
        <line x1="0" y1="56" x2="110" y2="56"/><line x1="0" y1="108" x2="110" y2="108"/>
        <line x1="0" y1="160" x2="110" y2="160"/><line x1="0" y1="212" x2="110" y2="212"/>
      </g>
      <g class="dim">
        <line x1="126" y1="4" x2="126" y2="264"/>
        <line x1="122" y1="4" x2="130" y2="4"/><line x1="122" y1="56" x2="130" y2="56"/>
        <line x1="122" y1="108" x2="130" y2="108"/><line x1="122" y1="160" x2="130" y2="160"/>
        <line x1="122" y1="212" x2="130" y2="212"/><line x1="122" y1="264" x2="130" y2="264"/>
      </g>
      <text class="val" x="138" y="34">180</text>
      <text class="val" x="138" y="86">142</text>
      <text class="hitv" x="138" y="138">105</text>
      <text class="val" x="138" y="190">68</text>
      <text class="val" x="138" y="242">30</text>
      <text class="lbl" x="138" y="282">MM/S</text>
      <line class="dim" x1="-8" y1="264" x2="176" y2="264" stroke-opacity=".5"/>
      <text class="idx" x="0" y="312">02</text>
      <text class="name" x="0" y="336">SPEED TOWER</text>
      <text class="lbl" x="0" y="356">PRINT SPEED</text>
    </g>

    <!-- 03 TOLERANCE TEST: six holes growing by a fixed step, one fits -->
    <g transform="translate(456,40)">
      <g class="ln">
        <rect x="0" y="4" width="184" height="260"/>
        <circle cx="46" cy="44" r="15"/><circle cx="138" cy="44" r="16"/>
        <circle cx="46" cy="124" r="17"/><circle cx="138" cy="124" r="18"/>
        <circle cx="46" cy="204" r="19"/><circle cx="138" cy="204" r="20"/>
      </g>
      <circle cx="46" cy="124" r="13" class="hit"/>
      <circle cx="46" cy="124" r="17" fill="none" stroke="#c5f13e" stroke-width="1.6"/>
      <text class="val" x="46" y="80" text-anchor="middle">0.0</text>
      <text class="val" x="138" y="80" text-anchor="middle">0.1</text>
      <text class="hitv" x="46" y="160" text-anchor="middle">0.2</text>
      <text class="val" x="138" y="160" text-anchor="middle">0.3</text>
      <text class="val" x="46" y="244" text-anchor="middle">0.4</text>
      <text class="val" x="138" y="244" text-anchor="middle">0.5</text>
      <text class="lbl" x="184" y="282" text-anchor="end">MM ⌀</text>
      <text class="idx" x="0" y="312">03</text>
      <text class="name" x="0" y="336">TOLERANCE TEST</text>
      <text class="lbl" x="0" y="356">FIT CLEARANCE</text>
    </g>
  </svg>
</body></html>
